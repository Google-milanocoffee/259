<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý Menu - Milano Coffee 259</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- Firebase SDK (chỉ Database, không cần Storage) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    body {
        background: #0f0f0f;
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        padding: 20px;
    }
    .admin-container {
        max-width: 800px;
        margin: 0 auto;
    }
    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .admin-header h1 {
        font-size: 24px;
        font-weight: 800;
    }
    .admin-header a {
        color: #00b14f;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
    }
    .admin-header a:hover {
        text-decoration: underline;
    }

    /* GitHub Token */
    .token-section {
        background: #1a1a1a;
        border: 1px solid #2c2c2c;
        border-radius: 16px;
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .token-section label {
        font-size: 13px;
        font-weight: 600;
        color: #c2c2c2;
        white-space: nowrap;
    }
    .token-section input {
        flex: 1;
        min-width: 200px;
        padding: 10px 14px;
        background: #0f0f0f;
        border: 1px solid #2c2c2c;
        border-radius: 10px;
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        outline: none;
    }
    .token-section input:focus {
        border-color: #00b14f;
    }
    .token-section .token-status {
        font-size: 12px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 999px;
    }
    .token-status.ok {
        background: rgba(0,177,79,0.15);
        color: #00b14f;
    }
    .token-status.none {
        background: rgba(255,59,48,0.15);
        color: #ff3b30;
    }
    .btn-token {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        background: #0A84FF;
        color: #fff;
        transition: opacity 0.2s;
    }
    .btn-token:hover {
        opacity: 0.8;
    }
    .btn-token-danger {
        background: #ff3b30;
    }

    /* Form thêm món */
    .add-form {
        background: #1a1a1a;
        border: 1px solid #2c2c2c;
        border-radius: 20px;
        padding: 24px;
        margin-bottom: 30px;
    }
    .add-form h2 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 18px;
    }
    .form-group {
        margin-bottom: 14px;
    }
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #c2c2c2;
        margin-bottom: 6px;
    }
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px 14px;
        background: #0f0f0f;
        border: 1px solid #2c2c2c;
        border-radius: 12px;
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #00b14f;
    }
    .form-group textarea {
        resize: vertical;
        min-height: 60px;
    }
    .form-group input[type="file"] {
        padding: 10px;
        font-size: 13px;
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }
    .btn-submit {
        width: 100%;
        padding: 14px;
        background: #00b14f;
        color: #fff;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-submit:hover {
        background: #009944;
    }
    .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Danh sách món */
    .menu-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .menu-item {
        background: #1a1a1a;
        border: 1px solid #2c2c2c;
        border-radius: 16px;
        padding: 16px;
        display: flex;
        gap: 16px;
        align-items: center;
    }
    .menu-item img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 12px;
        flex-shrink: 0;
    }
    .menu-item-info {
        flex: 1;
        min-width: 0;
    }
    .menu-item-info h3 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 4px;
    }
    .menu-item-info .price {
        font-size: 14px;
        color: #00b14f;
        font-weight: 600;
        margin-bottom: 4px;
    }
    .menu-item-info .desc {
        font-size: 13px;
        color: #c2c2c2;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .menu-item-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
    }
    .menu-item-actions button {
        padding: 8px 14px;
        border: none;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .menu-item-actions button:hover {
        opacity: 0.8;
    }
    .btn-edit {
        background: #0A84FF;
        color: #fff;
    }
    .btn-delete {
        background: #ff3b30;
        color: #fff;
    }
    .btn-move {
        background: #2c2c2c;
        color: #fff;
    }

    /* Modal sửa */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: rgba(0,0,0,0.75);
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .modal.show {
        display: flex;
    }
    .modal-box {
        width: 100%;
        max-width: 480px;
        background: #1a1a1a;
        border-radius: 24px;
        padding: 24px;
        border: 1px solid #2c2c2c;
    }
    .modal-box h2 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 18px;
    }

    .empty-msg {
        text-align: center;
        color: #666;
        padding: 40px 20px;
        font-size: 14px;
    }

    /* Upload progress */
    .upload-progress {
        display: none;
        text-align: center;
        padding: 10px;
        color: #c2c2c2;
        font-size: 13px;
    }
    .upload-progress.show {
        display: block;
    }

    /* Gallery admin */
    .gallery-admin-list {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
    }
    .gallery-admin-item {
        width: 120px;
        height: 213px;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #1a1a1a;
        border: 1px solid #2c2c2c;
        flex-shrink: 0;
    }
    .gallery-admin-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .gallery-admin-item .gallery-del {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(255,59,48,0.9);
        color: #fff;
        border: none;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
    }
    .gallery-empty-msg {
        width: 100%;
        text-align: center;
        color: #666;
        padding: 30px 0;
        font-size: 14px;
    }

    @media (max-width: 500px) {
        .form-row {
            grid-template-columns: 1fr;
        }
        .menu-item {
            flex-wrap: wrap;
        }
        .menu-item-actions {
            flex-direction: row;
            width: 100%;
        }
        .menu-item-actions button {
            flex: 1;
        }
    }
</style>
</head>
<body>

<div class="admin-container">

    <div class="admin-header">
        <h1>Quản lý thực đơn</h1>
        <div>
            <a href="index.html" target="_blank">Xem trang chủ &rarr;</a>
        </div>
    </div>

    <!-- GITHUB TOKEN -->
    <div class="token-section">
        <label>GitHub Token:</label>
        <input type="password" id="githubTokenInput" placeholder="Nhập GitHub Personal Access Token..." />
        <span class="token-status none" id="tokenStatus">Chưa cài</span>
        <button class="btn-token" onclick="saveToken()">Lưu</button>
        <button class="btn-token btn-token-danger" onclick="clearToken()">Xóa</button>
    </div>

    <!-- UPLOAD PROGRESS -->
    <div class="upload-progress" id="uploadProgress">Đang upload ảnh lên GitHub...</div>

    <!-- FORM THÊM MÓN -->
    <div class="add-form">
        <h2>Thêm món mới</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Tên món</label>
                <input type="text" id="inputName" placeholder="VD: Cà phê sữa đá" />
            </div>
            <div class="form-group">
                <label>Giá (VD: 15.000đ - 25.000đ)</label>
                <input type="text" id="inputPrice" placeholder="VD: 15.000đ - 25.000đ" />
            </div>
        </div>
        <div class="form-group">
            <label>Mô tả</label>
            <textarea id="inputDesc" placeholder="Mô tả ngắn về món..."></textarea>
        </div>
        <div class="form-group">
            <label>Ảnh</label>
            <input type="file" id="inputImage" accept="image/*" />
        </div>
        <button class="btn-submit" id="btnAdd" onclick="addMenuItem()">+ Thêm món</button>
    </div>

    <!-- DANH SÁCH MÓN -->
    <div class="menu-list" id="menuList"></div>

    <hr style="border:none;border-top:1px solid #2c2c2c;margin:40px 0;" />

    <!-- ===== GALLERY ẢNH QUÁN ===== -->
    <div class="add-form">
        <h2>Hình ảnh quán (Gallery)</h2>
        <p style="color:#c2c2c2;font-size:13px;margin-bottom:16px;line-height:1.6;">
            Ảnh sẽ hiển thị dạng cuộn ngang kiểu TikTok trên trang chủ. Tỷ lệ đẹp: 9:16 (dọc).
        </p>
        <div class="form-group">
            <label>Thêm ảnh mới</label>
            <input type="file" id="galleryImageInput" accept="image/*" />
        </div>
        <button class="btn-submit" id="btnAddGallery" onclick="addGalleryImage()">+ Thêm ảnh</button>
    </div>

    <div class="gallery-admin-list" id="galleryAdminList"></div>

</div>

<!-- MODAL SỬA -->
<div class="modal" id="editModal">
    <div class="modal-box">
        <h2>Sửa món</h2>
        <div class="form-group">
            <label>Tên món</label>
            <input type="text" id="editName" />
        </div>
        <div class="form-group">
            <label>Giá</label>
            <input type="text" id="editPrice" />
        </div>
        <div class="form-group">
            <label>Mô tả</label>
            <textarea id="editDesc"></textarea>
        </div>
        <div class="form-group">
            <label>Thay ảnh (nếu muốn đổi)</label>
            <input type="file" id="editImage" accept="image/*" />
        </div>
        <div style="display:flex; gap:12px;">
            <button class="btn-submit" id="btnSaveEdit" onclick="saveEdit()" style="flex:1;">Lưu</button>
            <button class="btn-submit" onclick="closeEditModal()" style="flex:1; background:#2b2b2b;">Hủy</button>
        </div>
    </div>
</div>

<script src="firebase-config.js"></script>
<script>
    // ========== CẤU HÌNH GITHUB ==========
    const GITHUB_OWNER = 'Google-milanocoffee';
    const GITHUB_REPO = '259';
    const GITHUB_BRANCH = 'main';
    const GITHUB_PATH = 'anh';
    const GITHUB_TOKEN_KEY = 'milano_github_token';
    const RAW_BASE = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + GITHUB_BRANCH + '/' + GITHUB_PATH;

    // ========== TOKEN MANAGEMENT ==========
    function getToken() {
        return localStorage.getItem(GITHUB_TOKEN_KEY) || '';
    }

    function saveToken() {
        const token = document.getElementById('githubTokenInput').value.trim();
        if (!token) { alert('Vui lòng nhập GitHub Token'); return; }
        localStorage.setItem(GITHUB_TOKEN_KEY, token);
        updateTokenUI();
        alert('Đã lưu token!');
    }

    function clearToken() {
        if (!confirm('Xóa token đã lưu?')) return;
        localStorage.removeItem(GITHUB_TOKEN_KEY);
        document.getElementById('githubTokenInput').value = '';
        updateTokenUI();
    }

    function updateTokenUI() {
        const token = getToken();
        const status = document.getElementById('tokenStatus');
        const input = document.getElementById('githubTokenInput');
        if (token) {
            status.className = 'token-status ok';
            status.textContent = 'Đã cài';
            input.value = token;
        } else {
            status.className = 'token-status none';
            status.textContent = 'Chưa cài';
        }
    }

    // ========== DỮ LIỆU ==========
    const DEFAULT_MENU = [
        {
            id: 'item_1',
            name: 'Cà phê Milano',
            price: '15.000đ - 25.000đ',
            desc: 'Cà phê đậm vị, pha theo công thức gia truyền.',
            image: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80&w=500&auto=format&fit=crop'
        },
        {
            id: 'item_2',
            name: 'Bạc xỉu',
            price: '15.000đ - 25.000đ',
            desc: 'Vị ngọt nhẹ, béo thơm, phù hợp cho người mới uống cà phê.',
            image: 'https://images.unsplash.com/photo-1485808191679-5f86510681a2?q=80&w=500&auto=format&fit=crop'
        },
        {
            id: 'item_3',
            name: 'Matcha',
            price: '20.000đ - 30.000đ',
            desc: 'Bột matcha nhập khẩu, xanh mát, thanh nhẹ.',
            image: 'https://images.unsplash.com/photo-1515823064-d6e0c04616a7?q=80&w=500&auto=format&fit=crop'
        },
        {
            id: 'item_4',
            name: 'Trà',
            price: '15.000đ - 25.000đ',
            desc: 'Trà tươi nguyên lá, hương vị tự nhiên, giải nhiệt.',
            image: 'https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?q=80&w=500&auto=format&fit=crop'
        },
        {
            id: 'item_5',
            name: 'Nước trái cây',
            price: '20.000đ - 35.000đ',
            desc: 'Ép tươi từ trái cây theo mùa, giàu vitamin.',
            image: 'https://images.unsplash.com/photo-1543364195-bfe6e4932397?q=80&w=500&auto=format&fit=crop'
        },
        {
            id: 'item_6',
            name: 'Yaourt',
            price: '10.000đ - 20.000đ',
            desc: 'Yaourt tự làm, chua nhẹ, béo mịn.',
            image: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?q=80&w=500&auto=format&fit=crop'
        }
    ];

    let currentEditId = null;

    // ========== ĐỌC/GHI FIREBASE ==========
    function getMenuFromFirebase(callback) {
        menuRef.once('value').then(snapshot => {
            const menu = snapshot.val();
            if (menu && menu.length > 0) {
                callback(menu);
            } else {
                menuRef.set(DEFAULT_MENU).then(() => {
                    callback(DEFAULT_MENU);
                });
            }
        });
    }

    function saveMenuToFirebase(menu, callback) {
        menuRef.set(menu).then(() => {
            if (callback) callback();
        });
    }

    // ========== RENDER DANH SÁCH ADMIN ==========
    function renderAdminList() {
        const container = document.getElementById('menuList');
        container.innerHTML = '<div style="text-align:center;color:#666;padding:40px 0;">Đang tải...</div>';

        getMenuFromFirebase(function(menu) {
            if (menu.length === 0) {
                container.innerHTML = '<div class="empty-msg">Chưa có món nào. Thêm món mới bên trên.</div>';
                return;
            }

            container.innerHTML = menu.map((item, index) => `
                <div class="menu-item">
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'" />
                    <div class="menu-item-info">
                        <h3>${escapeHtml(item.name)}</h3>
                        <div class="price">${escapeHtml(item.price)}</div>
                        <div class="desc">${escapeHtml(item.desc)}</div>
                    </div>
                    <div class="menu-item-actions">
                        <button class="btn-move" onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.4"' : ''}>&uarr;</button>
                        <button class="btn-move" onclick="moveItem(${index}, 1)" ${index === menu.length - 1 ? 'disabled style="opacity:0.4"' : ''}>&darr;</button>
                        <button class="btn-edit" onclick="openEdit('${item.id}')">Sửa</button>
                        <button class="btn-delete" onclick="deleteItem('${item.id}')">Xóa</button>
                    </div>
                </div>
            `).join('');
        });
    }

    // ========== UPLOAD ẢNH LÊN GITHUB ==========
    function showProgress(show) {
        document.getElementById('uploadProgress').className = 'upload-progress' + (show ? ' show' : '');
    }

    function setButtonsDisabled(disabled) {
        document.getElementById('btnAdd').disabled = disabled;
        document.getElementById('btnSaveEdit').disabled = disabled;
    }

    function uploadToGitHub(file, callback) {
        const token = getToken();
        if (!token) {
            alert('Vui lòng nhập GitHub Token trước!');
            return;
        }

        showProgress(true);
        setButtonsDisabled(true);

        // Đọc file thành base64
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Content = e.target.result.split(',')[1]; // Bỏ phần "data:image/...;base64,"
            const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const filePath = GITHUB_PATH + '/' + fileName;
            const apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + filePath;

            fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': 'token ' + token,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: 'Upload image ' + fileName,
                    content: base64Content,
                    branch: GITHUB_BRANCH
                })
            })
            .then(function(response) {
                return response.json().then(function(data) {
                    if (response.ok) {
                        // Thành công - lấy raw URL
                        const rawUrl = RAW_BASE + '/' + fileName;
                        showProgress(false);
                        setButtonsDisabled(false);
                        callback(rawUrl);
                    } else {
                        showProgress(false);
                        setButtonsDisabled(false);
                        if (response.status === 401) {
                            alert('Token không hợp lệ! Vui lòng kiểm tra lại GitHub Token.');
                        } else if (response.status === 422) {
                            alert('File đã tồn tại hoặc lỗi dữ liệu. Vui lòng thử lại với tên file khác.');
                        } else {
                            alert('Lỗi upload GitHub: ' + (data.message || 'Không xác định'));
                        }
                        console.error('GitHub API error:', data);
                    }
                });
            })
            .catch(function(error) {
                showProgress(false);
                setButtonsDisabled(false);
                alert('Lỗi kết nối GitHub: ' + error.message);
                console.error(error);
            });
        };
        reader.onerror = function() {
            showProgress(false);
            setButtonsDisabled(false);
            alert('Đọc file thất bại. Vui lòng thử lại.');
        };
        reader.readAsDataURL(file);
    }

    // ========== THÊM MÓN ==========
    function addMenuItem() {
        const name = document.getElementById('inputName').value.trim();
        const price = document.getElementById('inputPrice').value.trim();
        const desc = document.getElementById('inputDesc').value.trim();
        const fileInput = document.getElementById('inputImage');
        const file = fileInput.files[0];

        if (!name) { alert('Vui lòng nhập tên món'); return; }
        if (!price) { alert('Vui lòng nhập giá'); return; }

        const newItem = {
            id: 'item_' + Date.now(),
            name: name,
            price: price,
            desc: desc || '',
            image: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80&w=500&auto=format&fit=crop'
        };

        function saveNewItem(imageUrl) {
            if (imageUrl) newItem.image = imageUrl;
            getMenuFromFirebase(function(menu) {
                menu.push(newItem);
                saveMenuToFirebase(menu, function() {
                    renderAdminList();
                    clearForm();
                });
            });
        }

        if (file) {
            uploadToGitHub(file, function(rawUrl) {
                saveNewItem(rawUrl);
            });
        } else {
            saveNewItem(null);
        }
    }

    function clearForm() {
        document.getElementById('inputName').value = '';
        document.getElementById('inputPrice').value = '';
        document.getElementById('inputDesc').value = '';
        document.getElementById('inputImage').value = '';
    }

    // ========== SỬA MÓN ==========
    function openEdit(id) {
        currentEditId = id;
        getMenuFromFirebase(function(menu) {
            const item = menu.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editDesc').value = item.desc;
            document.getElementById('editImage').value = '';
            document.getElementById('editModal').classList.add('show');
        });
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
        currentEditId = null;
    }

    function saveEdit() {
        if (!currentEditId) return;

        const name = document.getElementById('editName').value.trim();
        const price = document.getElementById('editPrice').value.trim();
        const desc = document.getElementById('editDesc').value.trim();
        const fileInput = document.getElementById('editImage');
        const file = fileInput.files[0];

        if (!name) { alert('Vui lòng nhập tên món'); return; }
        if (!price) { alert('Vui lòng nhập giá'); return; }

        function updateItem(imageUrl) {
            getMenuFromFirebase(function(menu) {
                const index = menu.findIndex(i => i.id === currentEditId);
                if (index === -1) return;

                menu[index].name = name;
                menu[index].price = price;
                menu[index].desc = desc || '';
                if (imageUrl) menu[index].image = imageUrl;

                saveMenuToFirebase(menu, function() {
                    renderAdminList();
                    closeEditModal();
                });
            });
        }

        if (file) {
            uploadToGitHub(file, function(rawUrl) {
                updateItem(rawUrl);
            });
        } else {
            updateItem(null);
        }
    }

    // ========== XÓA MÓN ==========
    function deleteItem(id) {
        if (!confirm('Xóa món này?')) return;
        getMenuFromFirebase(function(menu) {
            const newMenu = menu.filter(i => i.id !== id);
            saveMenuToFirebase(newMenu, function() {
                renderAdminList();
            });
        });
    }

    // ========== DI CHUYỂN ==========
    function moveItem(index, direction) {
        getMenuFromFirebase(function(menu) {
            const target = index + direction;
            if (target < 0 || target >= menu.length) return;
            [menu[index], menu[target]] = [menu[target], menu[index]];
            saveMenuToFirebase(menu, function() {
                renderAdminList();
            });
        });
    }

    // ========== HELPER ==========
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ========== GALLERY ẢNH QUÁN ==========
    const GALLERY_REF_KEY = 'gallery';

    function getGalleryFromFirebase(callback) {
        const galleryRef = db.ref(GALLERY_REF_KEY);
        galleryRef.once('value').then(function(snapshot) {
            const images = snapshot.val();
            callback(images || []);
        });
    }

    function saveGalleryToFirebase(images, callback) {
        const galleryRef = db.ref(GALLERY_REF_KEY);
        galleryRef.set(images).then(function() {
            if (callback) callback();
        });
    }

    function renderGalleryAdmin() {
        const container = document.getElementById('galleryAdminList');
        if (!container) return;

        getGalleryFromFirebase(function(images) {
            if (!images || images.length === 0) {
                container.innerHTML = '<div class="gallery-empty-msg">Chưa có ảnh nào. Thêm ảnh bên trên.</div>';
                return;
            }

            container.innerHTML = images.map(function(url, index) {
                return '<div class="gallery-admin-item">' +
                    '<img src="' + url + '" alt="Ảnh quán" onerror="this.parentElement.style.display=\'none\'" />' +
                    '<button class="gallery-del" onclick="deleteGalleryImage(' + index + ')" title="Xóa ảnh">&times;</button>' +
                    '</div>';
            }).join('');
        });
    }

    function addGalleryImage() {
        const fileInput = document.getElementById('galleryImageInput');
        const file = fileInput.files[0];
        if (!file) { alert('Vui lòng chọn ảnh!'); return; }

        uploadToGitHub(file, function(rawUrl) {
            getGalleryFromFirebase(function(images) {
                images.push(rawUrl);
                saveGalleryToFirebase(images, function() {
                    renderGalleryAdmin();
                    fileInput.value = '';
                });
            });
        });
    }

    function deleteGalleryImage(index) {
        if (!confirm('Xóa ảnh này?')) return;
        getGalleryFromFirebase(function(images) {
            images.splice(index, 1);
            saveGalleryToFirebase(images, function() {
                renderGalleryAdmin();
            });
        });
    }

    // ========== KHỞI TẠO ==========
    updateTokenUI();
    renderAdminList();
    renderGalleryAdmin();
</script>

</body>
</html>
