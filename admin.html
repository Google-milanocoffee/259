<style>

        background: #0f0f0f;
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        padding: 20px;
    }
    .admin-container {
        max-width: 800px;

    }
    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        flex-wrap: wrap;

    }
    .admin-header h1 {

    }
    .admin-header a {
        color: #00b14f;
        text-decoration: none;

        font-size: 14px;
    }
    .admin-header a:hover {
        text-decoration: underline;
    }

    .token-section {
        background: #1a1a1a;
        border: 1px solid #2c2c2c;
        border-radius: 16px;
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .token-section label {
        font-size: 13px;
        font-weight: 600;
        color: #c2c2c2;
        white-space: nowrap;
    }
    .token-section input {
        flex: 1;
        min-width: 200px;
        padding: 10px 14px;

        border: 1px solid #2c2c2c;
        border-radius: 10px;

    .token-section input:focus {

    }
    .token-section .token-status {

    .btn-token {

<script>
    // ========== CẤU HÌNH GITHUB ==========
    const GITHUB_OWNER = 'Google-milanocoffee';
    const GITHUB_REPO = '259';
    const GITHUB_BRANCH = 'main';
    const GITHUB_PATH = 'anh';
    const GITHUB_TOKEN_KEY = 'milano_github_token';
    const RAW_BASE = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + GITHUB_BRANCH + '/' + GITHUB_PATH;

    // ========== NÉN ẢNH ==========
    function compressImage(file, maxWidth = 600, maxHeight = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = height * (maxWidth / width);
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width = width * (maxHeight / height);
                        height = maxHeight;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(width);
                    canvas.height = Math.round(height);
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(function(blob) {
                        const newFile = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { 
                            type: 'image/jpeg' 
                        });
                        resolve(newFile);
                    }, 'image/jpeg', quality);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    // ========== TOKEN MANAGEMENT ==========
    function getToken() {
        return localStorage.getItem(GITHUB_TOKEN_KEY) || '';
    }

    function saveToken() {
        const token = document.getElementById('githubTokenInput').value.trim();
        if (!token) { alert('Vui lòng nhập GitHub Token'); return; }
        localStorage.setItem(GITHUB_TOKEN_KEY, token);
        updateTokenUI();
        alert('Đã lưu token!');
    }

    function clearToken() {
        if (!confirm('Xóa token đã lưu?')) return;
        localStorage.removeItem(GITHUB_TOKEN_KEY);
        document.getElementById('githubTokenInput').value = '';
        updateTokenUI();
    }

    function updateTokenUI() {
        const token = getToken();
        const status = document.getElementById('tokenStatus');
        const input = document.getElementById('githubTokenInput');
        if (token) {
            status.className = 'token-status ok';
            status.textContent = 'Đã cài';
            input.value = token;
        } else {
            status.className = 'token-status none';
            status.textContent = 'Chưa cài';
        }
    }

    // ========== UPLOAD ẢNH LÊN GITHUB (CÓ NÉN) ==========
    function showProgress(show) {
        document.getElementById('uploadProgress').className = 'upload-progress' + (show ? ' show' : '');
    }

    function setButtonsDisabled(disabled) {
        document.getElementById('btnAdd').disabled = disabled;
        document.getElementById('btnSaveEdit').disabled = disabled;
        document.getElementById('btnAddGallery').disabled = disabled;
    }

    function uploadToGitHub(file, callback) {
        const token = getToken();
        if (!token) {
            alert('Vui lòng nhập GitHub Token trước!');
            return;
        }

        showProgress(true);
        setButtonsDisabled(true);

        // Nén ảnh trước khi upload
        const isGallery = file.name.includes('gallery') || document.getElementById('galleryImageInput')?.files?.[0] === file;
        const maxWidth = isGallery ? 600 : 400;
        const maxHeight = isGallery ? 800 : 400;
        
        compressImage(file, maxWidth, maxHeight, 0.7).then(function(compressedFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Content = e.target.result.split(',')[1];
                const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_').replace(/\.[^.]+$/, '.jpg');
                const filePath = GITHUB_PATH + '/' + fileName;
                const apiUrl = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + filePath;

                fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + token,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Upload image ' + fileName,
                        content: base64Content,
                        branch: GITHUB_BRANCH
                    })
                })
                .then(function(response) {
                    return response.json().then(function(data) {
                        if (response.ok) {
                            const rawUrl = RAW_BASE + '/' + fileName;
                            showProgress(false);
                            setButtonsDisabled(false);
                            callback(rawUrl);
                        } else {
                            showProgress(false);
                            setButtonsDisabled(false);
                            if (response.status === 401) {
                                alert('Token không hợp lệ!');
                            } else {
                                alert('Lỗi upload: ' + (data.message || 'Không xác định'));
                            }
                        }
                    });
                })
                .catch(function(error) {
                    showProgress(false);
                    setButtonsDisabled(false);
                    alert('Lỗi kết nối: ' + error.message);
                });
            };
            reader.readAsDataURL(compressedFile);
        }).catch(function(error) {
            showProgress(false);
            setButtonsDisabled(false);
            alert('Lỗi nén ảnh: ' + error.message);
        });
    }

    let currentEditId = null;

    // ========== ĐỌC/GHI FIREBASE ==========
    function getMenuFromFirebase(callback) {
        menuRef.once('value').then(snapshot => {
            const menu = snapshot.val();
            if (menu && menu.length > 0) {
                callback(menu);
            } else {
                menuRef.set(DEFAULT_MENU).then(() => {
                    callback(DEFAULT_MENU);
                });
            }
        });
    }

    function saveMenuToFirebase(menu, callback) {
        menuRef.set(menu).then(() => {
            // Cập nhật version
            versionRef.update({ menu: Date.now() });
            if (callback) callback();
        });
    }

    // ========== RENDER DANH SÁCH ADMIN ==========
    function renderAdminList() {
        const container = document.getElementById('menuList');
        container.innerHTML = '<div style="text-align:center;color:#666;padding:40px 0;">Đang tải...</div>';

        getMenuFromFirebase(function(menu) {
            if (menu.length === 0) {
                container.innerHTML = '<div class="empty-msg">Chưa có món nào. Thêm món mới bên trên.</div>';
                return;
            }

            container.innerHTML = menu.map((item) => `
                <div class="menu-item" draggable="true" data-id="${escapeHtml(item.id)}">
                    <div class="admin-drag-handle">⠿</div>
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'" />
                    <div class="menu-item-info">
                        <h3>${escapeHtml(item.name)}</h3>
                        <div class="price">${escapeHtml(item.price)}</div>
                        <div class="desc">${escapeHtml(item.desc)}</div>
                    </div>
                    <div class="menu-item-actions">
                        <button class="btn-edit" onclick="openEdit('${item.id}')">Sửa</button>
                        <button class="btn-delete" onclick="deleteItem('${item.id}')">Xóa</button>
                    </div>
                </div>
            `).join('');

            // Khởi tạo drag & drop cho menu
            initMenuDragDrop();
        });
    }

    // ========== DRAG & DROP MENU ==========
    function initMenuDragDrop() {
        const container = document.getElementById('menuList');
        if (!container) return;

        let dragItem = null;

        container.addEventListener('dragstart', function(e) {
            const item = e.target.closest('.menu-item');
            if (!item) return;
            dragItem = item;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', item.getAttribute('data-id') || '');
        });

        container.addEventListener('dragend', function(e) {
            const item = e.target.closest('.menu-item');
            if (item) item.classList.remove('dragging');
            container.querySelectorAll('.menu-item').forEach(function(el) {
                el.classList.remove('drag-over-top', 'drag-over-bottom');
            });
            dragItem = null;
        });

        container.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.menu-item');
            if (!target || target === dragItem) return;

            container.querySelectorAll('.menu-item').forEach(function(el) {
                el.classList.remove('drag-over-top', 'drag-over-bottom');
            });

            const rect = target.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            target.classList.add(e.clientY < midY ? 'drag-over-top' : 'drag-over-bottom');
        });

        container.addEventListener('drop', function(e) {
            e.preventDefault();
            const target = e.target.closest('.menu-item');
            if (!target || !dragItem || target === dragItem) {
                container.querySelectorAll('.menu-item').forEach(function(el) {
                    el.classList.remove('drag-over-top', 'drag-over-bottom');
                });
                return;
            }

            const rect = target.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            const insertBefore = e.clientY < midY;

            const allItems = Array.from(container.querySelectorAll('.menu-item'));
            const ids = allItems.map(function(el) { return el.getAttribute('data-id'); });
            const dragId = dragItem.getAttribute('data-id');
            const targetId = target.getAttribute('data-id');
            const dragIdx = ids.indexOf(dragId);
            const targetIdx = ids.indexOf(targetId);
            if (dragIdx === -1 || targetIdx === -1) return;

            ids.splice(dragIdx, 1);
            const newTargetIdx = ids.indexOf(targetId);
            ids.splice(insertBefore ? newTargetIdx : newTargetIdx + 1, 0, dragId);

            getMenuFromFirebase(function(menu) {
                const menuMap = {};
                menu.forEach(function(item) { menuMap[item.id] = item; });
                const reordered = [];
                ids.forEach(function(id) {
                    if (menuMap[id]) { reordered.push(menuMap[id]); delete menuMap[id]; }
                });
                Object.keys(menuMap).forEach(function(id) { reordered.push(menuMap[id]); });
                saveMenuToFirebase(reordered, function() { renderAdminList(); });
            });

            container.querySelectorAll('.menu-item').forEach(function(el) {
                el.classList.remove('drag-over-top', 'drag-over-bottom');
            });
            dragItem = null;
        });

        // Touch support cho mobile - kéo từ bất kỳ đâu trên item (trừ nút)
        let touchDragItem = null;
        let touchClone = null;
        let touchOffsetY = 0;
        let touchStartTime = 0;

        container.addEventListener('touchstart', function(e) {
            const item = e.target.closest('.menu-item');
            if (!item) return;
            // Không kéo khi chạm vào nút
            if (e.target.closest('.menu-item-actions') || e.target.closest('button')) return;

            touchDragItem = item;
            touchOffsetY = e.touches[0].clientY - item.getBoundingClientRect().top;
            touchStartTime = Date.now();

            touchClone = item.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.width = item.offsetWidth + 'px';
            touchClone.style.zIndex = '99999';
            touchClone.style.opacity = '0.85';
            touchClone.style.pointerEvents = 'none';
            touchClone.style.transform = 'scale(0.97) rotate(1deg)';
            touchClone.style.boxShadow = '0 20px 60px rgba(0,0,0,0.5)';
            touchClone.style.borderColor = '#00b14f';
            touchClone.style.borderRadius = '16px';
            document.body.appendChild(touchClone);

            item.style.opacity = '0.3';

            const x = e.touches[0].clientX - item.offsetWidth / 2;
            const y = e.touches[0].clientY - touchOffsetY;
            touchClone.style.left = x + 'px';
            touchClone.style.top = y + 'px';
        }, { passive: true });

        container.addEventListener('touchmove', function(e) {
            if (!touchDragItem || !touchClone) return;
            e.preventDefault();

            const x = e.touches[0].clientX - touchDragItem.offsetWidth / 2;
            const y = e.touches[0].clientY - touchOffsetY;
            touchClone.style.left = x + 'px';
            touchClone.style.top = y + 'px';

            const touchY = e.touches[0].clientY;
            container.querySelectorAll('.menu-item').forEach(function(el) {
                el.classList.remove('drag-over-top', 'drag-over-bottom');
            });

            const items = container.querySelectorAll('.menu-item');
            for (const el of items) {
                if (el === touchDragItem) continue;
                const rect = el.getBoundingClientRect();
                if (touchY >= rect.top && touchY <= rect.bottom) {
                    const midY = rect.top + rect.height / 2;
                    el.classList.add(touchY < midY ? 'drag-over-top' : 'drag-over-bottom');
                    break;
                }
            }
        }, { passive: false });

        container.addEventListener('touchend', function(e) {
            if (!touchDragItem || !touchClone) return;
            if (touchClone.parentNode) touchClone.parentNode.removeChild(touchClone);
            touchClone = null;

            const touchY = e.changedTouches[0].clientY;
            const items = container.querySelectorAll('.menu-item');
            let targetEl = null;
            let insertBefore = true;

            for (const el of items) {
                if (el === touchDragItem) continue;
                const rect = el.getBoundingClientRect();
                if (touchY >= rect.top && touchY <= rect.bottom) {
                    targetEl = el;
                    const midY = rect.top + rect.height / 2;
                    insertBefore = touchY < midY;
                    break;
                }
            }

            items.forEach(function(el) { el.classList.remove('drag-over-top', 'drag-over-bottom'); });

            if (targetEl) {
                const allItems = Array.from(items);
                const ids = allItems.map(function(el) { return el.getAttribute('data-id'); });
                const dragId = touchDragItem.getAttribute('data-id');
                const targetId = targetEl.getAttribute('data-id');
                const dragIdx = ids.indexOf(dragId);
                const targetIdx = ids.indexOf(targetId);

                if (dragIdx !== -1 && targetIdx !== -1) {
                    ids.splice(dragIdx, 1);
                    const newTargetIdx = ids.indexOf(targetId);
                    ids.splice(insertBefore ? newTargetIdx : newTargetIdx + 1, 0, dragId);

                    getMenuFromFirebase(function(menu) {
                        const menuMap = {};
                        menu.forEach(function(item) { menuMap[item.id] = item; });
                        const reordered = [];
                        ids.forEach(function(id) {
                            if (menuMap[id]) { reordered.push(menuMap[id]); delete menuMap[id]; }
                        });
                        Object.keys(menuMap).forEach(function(id) { reordered.push(menuMap[id]); });
                        saveMenuToFirebase(reordered, function() { renderAdminList(); });
                    });
                }
            }

            touchDragItem.style.opacity = '1';
            touchDragItem = null;
        }, { passive: true });
    }

    // ========== THÊM MÓN ==========
    function addMenuItem() {
        const name = document.getElementById('inputName').value.trim();
        const price = document.getElementById('inputPrice').value.trim();
        const desc = document.getElementById('inputDesc').value.trim();
        const fileInput = document.getElementById('inputImage');
        const file = fileInput.files[0];

        if (!name) { alert('Vui lòng nhập tên món'); return; }
        if (!price) { alert('Vui lòng nhập giá'); return; }

        const newItem = {
            id: 'item_' + Date.now(),
            name: name,
            price: price,
            desc: desc || '',
            image: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80&w=500&auto=format&fit=crop'
        };

        function saveNewItem(imageUrl) {
            if (imageUrl) newItem.image = imageUrl;
            getMenuFromFirebase(function(menu) {
                menu.push(newItem);
                saveMenuToFirebase(menu, function() {
                    renderAdminList();
                    clearForm();
                });
            });
        }

        if (file) {
            uploadToGitHub(file, function(rawUrl) {
                saveNewItem(rawUrl);
            });
        } else {
            saveNewItem(null);
        }
    }

    function clearForm() {
        document.getElementById('inputName').value = '';
        document.getElementById('inputPrice').value = '';
        document.getElementById('inputDesc').value = '';
        document.getElementById('inputImage').value = '';
    }

    // ========== SỬA MÓN ==========
    function openEdit(id) {
        currentEditId = id;
        getMenuFromFirebase(function(menu) {
            const item = menu.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editDesc').value = item.desc;
            document.getElementById('editImage').value = '';
            document.getElementById('editModal').classList.add('show');
        });
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
        currentEditId = null;
    }

    function saveEdit() {
        if (!currentEditId) return;

        const name = document.getElementById('editName').value.trim();
        const price = document.getElementById('editPrice').value.trim();
        const desc = document.getElementById('editDesc').value.trim();
        const fileInput = document.getElementById('editImage');
        const file = fileInput.files[0];

        if (!name) { alert('Vui lòng nhập tên món'); return; }
        if (!price) { alert('Vui lòng nhập giá'); return; }

        function updateItem(imageUrl) {
            getMenuFromFirebase(function(menu) {
                const index = menu.findIndex(i => i.id === currentEditId);
                if (index === -1) return;

                menu[index].name = name;
                menu[index].price = price;
                menu[index].desc = desc || '';
                if (imageUrl) menu[index].image = imageUrl;

                saveMenuToFirebase(menu, function() {
                    renderAdminList();
                    closeEditModal();
                });
            });
        }

        if (file) {
            uploadToGitHub(file, function(rawUrl) {
                updateItem(rawUrl);
            });
        } else {
            updateItem(null);
        }
    }

    // ========== XÓA MÓN ==========
    function deleteItem(id) {
        if (!confirm('Xóa món này?')) return;
        getMenuFromFirebase(function(menu) {
            const newMenu = menu.filter(i => i.id !== id);
            saveMenuToFirebase(newMenu, function() {
                renderAdminList();
            });
        });
    }

    // ========== HELPER ==========
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ========== GALLERY ẢNH QUÁN ==========
    const GALLERY_REF_KEY = 'gallery';

    function getGalleryFromFirebase(callback) {
        const galleryRef = db.ref(GALLERY_REF_KEY);
        galleryRef.once('value').then(function(snapshot) {
            const images = snapshot.val();
            callback(images || []);
        });
    }

    function saveGalleryToFirebase(images, callback) {
        const galleryRef = db.ref(GALLERY_REF_KEY);
        galleryRef.set(images).then(function() {
            versionRef.update({ gallery: Date.now() });
            if (callback) callback();
        });
    }

    function renderGalleryAdmin() {
        const container = document.getElementById('galleryAdminList');
        if (!container) return;

        getGalleryFromFirebase(function(images) {
            if (!images || images.length === 0) {
                container.innerHTML = '<div class="gallery-empty-msg">Chưa có ảnh nào. Thêm ảnh bên trên.</div>';
                return;
            }

            container.innerHTML = images.map(function(url, index) {
                return '<div class="gallery-admin-item" draggable="true" data-gallery-index="' + index + '">' +
                    '<img src="' + url + '" alt="Ảnh quán" onerror="this.parentElement.style.display=\'none\'" />' +
                    '<button class="gallery-del" onclick="deleteGalleryImage(' + index + ')" title="Xóa ảnh">&times;</button>' +
                    '</div>';
            }).join('');

            initGalleryDragDrop();
        });
    }

    // ========== DRAG & DROP GALLERY ==========
    function initGalleryDragDrop() {
        const container = document.getElementById('galleryAdminList');
        if (!container) return;

        let dragItem = null;

        container.addEventListener('dragstart', function(e) {
            const item = e.target.closest('.gallery-admin-item');
            if (!item) return;
            if (e.target.closest('.gallery-del')) { e.preventDefault(); return; }
            dragItem = item;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        container.addEventListener('dragend', function(e) {
            const item = e.target.closest('.gallery-admin-item');
            if (item) item.classList.remove('dragging');
            container.querySelectorAll('.gallery-admin-item').forEach(function(el) {
                el.classList.remove('drag-over-left', 'drag-over-right');
            });
            dragItem = null;
        });

        container.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.gallery-admin-item');
            if (!target || target === dragItem) return;

            container.querySelectorAll('.gallery-admin-item').forEach(function(el) {
                el.classList.remove('drag-over-left', 'drag-over-right');
            });

            const rect = target.getBoundingClientRect();
            const midX = rect.left + rect.width / 2;
            target.classList.add(e.clientX < midX ? 'drag-over-left' : 'drag-over-right');
        });

        container.addEventListener('drop', function(e) {
            e.preventDefault();
            const target = e.target.closest('.gallery-admin-item');
            if (!target || !dragItem || target === dragItem) {
                container.querySelectorAll('.gallery-admin-item').forEach(function(el) {
                    el.classList.remove('drag-over-left', 'drag-over-right');
                });
                return;
            }

            const rect = target.getBoundingClientRect();
            const midX = rect.left + rect.width / 2;
            const insertBefore = e.clientX < midX;

            const dragIdx = parseInt(dragItem.getAttribute('data-gallery-index'));
            const targetIdx = parseInt(target.getAttribute('data-gallery-index'));

            if (isNaN(dragIdx) || isNaN(targetIdx)) return;

            getGalleryFromFirebase(function(images) {
                const item = images.splice(dragIdx, 1)[0];
                const newTargetIdx = images.indexOf(images[targetIdx > dragIdx ? targetIdx - 1 : targetIdx]);
                const insertIdx = insertBefore ? newTargetIdx : newTargetIdx + 1;
                images.splice(insertIdx, 0, item);
                saveGalleryToFirebase(images, function() { renderGalleryAdmin(); });
            });

            container.querySelectorAll('.gallery-admin-item').forEach(function(el) {
                el.classList.remove('drag-over-left', 'drag-over-right');
            });
            dragItem = null;
        });

        // Touch support cho mobile
        let touchDragItem = null;
        let touchClone = null;
        let touchOffsetX = 0;

        container.addEventListener('touchstart', function(e) {
            const item = e.target.closest('.gallery-admin-item');
            if (!item) return;
            if (e.target.closest('.gallery-del')) return;

            touchDragItem = item;
            touchOffsetX = e.touches[0].clientX - item.getBoundingClientRect().left;

            touchClone = item.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.width = item.offsetWidth + 'px';
            touchClone.style.zIndex = '99999';
            touchClone.style.opacity = '0.85';
            touchClone.style.pointerEvents = 'none';
            touchClone.style.transform = 'scale(0.95) rotate(2deg)';
            touchClone.style.boxShadow = '0 20px 60px rgba(0,0,0,0.5)';
            touchClone.style.borderColor = '#0A84FF';
            touchClone.style.borderRadius = '12px';
            document.body.appendChild(touchClone);

            item.style.opacity = '0.3';

            const x = e.touches[0].clientX - touchOffsetX;
            const y = e.touches[0].clientY - 100;
            touchClone.style.left = x + 'px';
            touchClone.style.top = y + 'px';
        }, { passive: true });

        container.addEventListener('touchmove', function(e) {
            if (!touchDragItem || !touchClone) return;
            e.preventDefault();

            const x = e.touches[0].clientX - touchOffsetX;
            const y = e.touches[0].clientY - 100;
            touchClone.style.left = x + 'px';
            touchClone.style.top = y + 'px';

            const touchX = e.touches[0].clientX;
            container.querySelectorAll('.gallery-admin-item').forEach(function(el) {
                el.classList.remove('drag-over-left', 'drag-over-right');
            });

            const items = container.querySelectorAll('.gallery-admin-item');
            for (const el of items) {
                if (el === touchDragItem) continue;
                const rect = el.getBoundingClientRect();
                if (touchX >= rect.left && touchX <= rect.right) {
                    const midX = rect.left + rect.width / 2;
                    el.classList.add(touchX < midX ? 'drag-over-left' : 'drag-over-right');
                    break;
                }
            }
        }, { passive: false });

        container.addEventListener('touchend', function(e) {
            if (!touchDragItem || !touchClone) return;
            if (touchClone.parentNode) touchClone.parentNode.removeChild(touchClone);
            touchClone = null;

            const touchX = e.changedTouches[0].clientX;
            const items = container.querySelectorAll('.gallery-admin-item');
            let targetEl = null;
            let insertBefore = true;

            for (const el of items) {
                if (el === touchDragItem) continue;
                const rect = el.getBoundingClientRect();
                if (touchX >= rect.left && touchX <= rect.right) {
                    targetEl = el;
                    const midX = rect.left + rect.width / 2;
                    insertBefore = touchX < midX;
                    break;
                }
            }

            items.forEach(function(el) { el.classList.remove('drag-over-left', 'drag-over-right'); });

            if (targetEl) {
                const dragIdx = parseInt(touchDragItem.getAttribute('data-gallery-index'));
                const targetIdx = parseInt(targetEl.getAttribute('data-gallery-index'));

                if (!isNaN(dragIdx) && !isNaN(targetIdx)) {
                    getGalleryFromFirebase(function(images) {
                        const item = images.splice(dragIdx, 1)[0];
                        const newTargetIdx = images.indexOf(images[targetIdx > dragIdx ? targetIdx - 1 : targetIdx]);
                        const insertIdx = insertBefore ? newTargetIdx : newTargetIdx + 1;
                        images.splice(insertIdx, 0, item);
                        saveGalleryToFirebase(images, function() { renderGalleryAdmin(); });
                    });
                }
            }

            touchDragItem.style.opacity = '1';
            touchDragItem = null;
        }, { passive: true });
    }

    function addGalleryImage() {
        const fileInput = document.getElementById('galleryImageInput');
        const file = fileInput.files[0];
        if (!file) { alert('Vui lòng chọn ảnh!'); return; }

        uploadToGitHub(file, function(rawUrl) {
            getGalleryFromFirebase(function(images) {
                images.push(rawUrl);
                saveGalleryToFirebase(images, function() {
                    renderGalleryAdmin();
                    fileInput.value = '';
                });
            });
        });
    }

    function deleteGalleryImage(index) {
        if (!confirm('Xóa ảnh này?')) return;
        getGalleryFromFirebase(function(images) {
            images.splice(index, 1);
            saveGalleryToFirebase(images, function() {
                renderGalleryAdmin();
            });
        });
    }

    // ========== KHỞI TẠO ==========
    updateTokenUI();
    renderAdminList();
    renderGalleryAdmin();
</script>
